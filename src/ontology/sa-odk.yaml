      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-hh.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-mv.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-ni.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-nw.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-rp.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-sl.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-sn.owl
      use_template: true
      template_options: --input sa-edit.owl      
    - filename: schools-st.owl
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-sh.owl
