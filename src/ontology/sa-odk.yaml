id: sa
title: "Schulart Ontology"
#github_org: FWU-DE
#git_main_branch: main
#repo: schulart-ontologie
uribase: https://w3id.org/schulart
#uribase_suffix: ontology
release_artefacts:
  - full
primary_release: full
export_formats:
  - ttl
remove_owl_nothing: true
import_group:
  annotation_properties: ['rdfs:label', 'IAO:0000115', 'skos:definition']
  products:
    - id: lp 
      mirror_from: https://w3id.org/lehrplan/ontology
      module_type: slme
      module_type_slme: SUBSET
    - id: kim
      module_type: custom
      mirror_type: no_mirror
    - id: skos
      mirror_from: http://www.w3.org/TR/skos-reference/skos.rdf
      module_type: slme
      module_type_slme: SUBSET
components:
  products:
    - filename: levels.owl
    - filename: schools-by.owl 
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-be.owl 
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-bb.owl 
      use_template: true
      template_options: --input sa-edit.owl
    - filename: schools-bw.owl 
      use_template: true
      template_options: --input sa-edit.owl
